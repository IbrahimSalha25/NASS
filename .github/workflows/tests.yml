name: CI Test Suite

on:
  push:
    branches: [ main, "feature/**", "refactor/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system Tesseract and Arabic/English language packs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng libgl1 libegl1

      - name: Install system Tesseract (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --version=5.3.3
          echo "C:\Program Files\Tesseract-OCR" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Test Suite with Pytest
        run: |
          pytest tests
