[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nass-ocr"
version = "1.0.0"
description = "Smart OCR & Multi-Format Document Text Extraction Desktop Application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ibrahim Salha", email = "ibrahim.salha19@gmail.com" }
]
keywords = [
    "ocr",
    "arabic-ocr",
    "tesseract",
    "text-extraction",
    "pdf-ocr",
    "desktop-application",
    "pyside6",
    "latex",
    "docx",
    "excel",
    "open-source"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: General"
]
dependencies = [
    "PySide6>=6.6.0",
    "pytesseract>=0.3.10",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.20",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/IbrahimSalha25/NASS"
Repository = "https://github.com/IbrahimSalha25/NASS"
Issues = "https://github.com/IbrahimSalha25/NASS/issues"

[project.scripts]
nass = "nass.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
